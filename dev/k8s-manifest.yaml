apiVersion: v1
kind: Namespace
metadata:
  name: k-watch
  labels:
    name: k-watch
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: k-watch
  namespace: k-watch
  labels:
    app: k-watch
spec:
  replicas: 1
  selector:
    matchLabels:
      app: k-watch
  template:
    metadata:
      labels:
        app: k-watch
    spec:
      serviceAccountName: k-watch
      # Same security settings as the Helm chart defaults.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: k-watch
        image: k-watch:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 8282
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 100m
            memory: 128Mi
        livenessProbe:
          httpGet:
            path: /api/healthz
            port: 8282
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /api/healthz
            port: 8282
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: k-watch
  namespace: k-watch
  labels:
    app: k-watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: k-watch
rules:
- apiGroups: [""]
  resources: ["pods", "services", "namespaces", "nodes", "persistentvolumes", "persistentvolumeclaims", "events"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["apps"]
  resources: ["deployments", "replicasets", "statefulsets", "daemonsets"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["batch"]
  resources: ["jobs", "cronjobs"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["networking.k8s.io"]
  resources: ["ingresses"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["discovery.k8s.io"]
  resources: ["endpointslices"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["metrics.k8s.io"]
  resources: ["nodes", "pods"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: k-watch
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: k-watch
subjects:
- kind: ServiceAccount
  name: k-watch
  namespace: k-watch
---
apiVersion: v1
kind: Service
metadata:
  name: k-watch
  namespace: k-watch
  labels:
    app: k-watch
spec:
  type: NodePort
  ports:
  - port: 8282
    targetPort: 8282
    nodePort: 30082
    protocol: TCP
    name: http
  selector:
    app: k-watch
