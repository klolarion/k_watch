# -----------------------------
# Namespaces
# -----------------------------
apiVersion: v1
kind: Namespace
metadata:
  name: team-a
  labels:
    team: a
---
apiVersion: v1
kind: Namespace
metadata:
  name: team-b
  labels:
    team: b
---
apiVersion: v1
kind: Namespace
metadata:
  name: team-c
  labels:
    team: "c"
# -----------------------------
# team-a: Config & Secret
# -----------------------------
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: web-config
  namespace: team-a
data:
  WELCOME_MSG: "Hello from team-a web!"
---
apiVersion: v1
kind: Secret
metadata:
  name: api-secret
  namespace: team-a
type: Opaque
stringData:
  API_KEY: "demo-key-1234"

# -----------------------------
# team-a: Web (Deployment + SVC + Ingress)
# -----------------------------
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: team-a
  labels: { app: web }
spec:
  replicas: 3
  selector: { matchLabels: { app: web } }
  template:
    metadata:
      labels: { app: web }
    spec:
      containers:
        - name: nginx
          image: nginx:1.25
          ports: [{ containerPort: 80 }]
          envFrom:
            - configMapRef: { name: web-config }
          volumeMounts:
            - name: web-storage
              mountPath: /var/www/html
          readinessProbe:
            httpGet: { path: /, port: 80 }
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /, port: 80 }
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: { cpu: "50m", memory: "64Mi" }
            limits:   { cpu: "200m", memory: "128Mi" }
      volumes:
        - name: web-storage
          persistentVolumeClaim:
            claimName: web-storage
---
apiVersion: v1
kind: Service
metadata:
  name: web-svc
  namespace: team-a
  labels: { app: web }
spec:
  type: ClusterIP
  selector: { app: web }
  ports:
    - port: 80
      targetPort: 80
      name: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: team-a-ing
  namespace: team-a
spec:
  ingressClassName: nginx 
  rules:
    - host: a.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: web-svc, port: { number: 80 } }
          - path: /api
            pathType: Prefix
            backend:
              service: { name: api-svc, port: { number: 8080 } }

# -----------------------------
# team-a: API (정상) + API (버기/CrashLoopBackOff)
# -----------------------------
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: team-a
  labels: { app: api }
spec:
  replicas: 2
  selector: { matchLabels: { app: api } }
  template:
    metadata:
      labels: { app: api }
    spec:
      containers:
        - name: api
          image: ghcr.io/traefik/whoami:v1.10.2
          ports: [{ containerPort: 80 }]
          env:
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: api-secret
                  key: API_KEY
          readinessProbe:
            httpGet: { path: /, port: 80 }
            initialDelaySeconds: 2
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: api-svc
  namespace: team-a
spec:
  selector: { app: api }
  ports:
    - port: 8080
      targetPort: 80
      name: http
---
# 의도적으로 CrashLoopBackOff 유도(계속 1초 후 종료)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: buggy
  namespace: team-a
  labels: { app: buggy }
spec:
  replicas: 1
  selector: { matchLabels: { app: buggy } }
  template:
    metadata:
      labels: { app: buggy }
    spec:
      containers:
        - name: buggy
          image: busybox:1.36
          command: ["sh","-c","echo Boom && sleep 1 && exit 1"]
          resources:
            requests: { cpu: "10m", memory: "16Mi" }
            limits:   { cpu: "50m", memory: "32Mi" }

# -----------------------------
# team-b: StatefulSet (Redis) + Headless Service + PVC
# -----------------------------
---
apiVersion: v1
kind: Service
metadata:
  name: redis-headless
  namespace: team-b
  labels: { app: redis }
spec:
  clusterIP: None
  selector: { app: redis }
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  namespace: team-b
  labels: { app: redis }
spec:
  serviceName: "redis-headless"
  replicas: 1
  selector: { matchLabels: { app: redis } }
  template:
    metadata: { labels: { app: redis } }
    spec:
      containers:
        - name: redis
          image: redis:7.2
          ports: [{ containerPort: 6379, name: redis } ]
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            tcpSocket: { port: 6379 }
            initialDelaySeconds: 3
            periodSeconds: 5
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: redis-data

# -----------------------------
# team-b: DaemonSet (log-agent) + NodePort SVC (예시)
# -----------------------------
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: log-agent
  namespace: team-b
  labels: { app: log-agent }
spec:
  selector: { matchLabels: { app: log-agent } }
  template:
    metadata: { labels: { app: log-agent } }
    spec:
      tolerations:
        - operator: "Exists"  # (있어도 한 노드니까 문제 없음)
      containers:
        - name: agent
          image: busybox:1.36
          args: ["sh","-c","while true; do echo $(date) logging; sleep 5; done"]
          resources:
            requests: { cpu: "10m", memory: "16Mi" }
            limits:   { cpu: "50m", memory: "32Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: agent-metrics
  namespace: team-b
spec:
  type: NodePort
  selector: { app: log-agent }
  ports:
    - name: http
      port: 9100
      targetPort: 9100
      nodePort: 30100

# -----------------------------
# default: Batch(Job & CronJob)
# -----------------------------
---
apiVersion: batch/v1
kind: Job
metadata:
  name: once-echo
  namespace: default
spec:
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: job
          image: busybox:1.36
          command: ["sh","-c","echo job started; sleep 3; echo job done"]
  backoffLimit: 1
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: minutely-echo
  namespace: default
spec:
  schedule: "*/5 * * * *"  # 5분마다
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: cj
              image: busybox:1.36
              command: ["sh","-c","date; echo hello from cron"]

# -----------------------------
# Storage: PV + PVC
# -----------------------------
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: redis-data-pv
  labels:
    type: local
spec:
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteOnce
  hostPath:
    path: "/tmp/redis-data"
  persistentVolumeReclaimPolicy: Retain
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-data
  namespace: team-b
spec:
  volumeName: redis-data-pv
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: web-storage-pv
  labels:
    type: local
spec:
  capacity:
    storage: 100Mi
  accessModes:
    - ReadWriteMany
  hostPath:
    path: "/tmp/web-storage"
  persistentVolumeReclaimPolicy: Retain
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: web-storage
  namespace: team-a
spec:
  volumeName: web-storage-pv
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 100Mi
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: postgres-data-pv
  labels:
    type: local
spec:
  capacity:
    storage: 2Gi
  accessModes:
    - ReadWriteOnce
  hostPath:
    path: "/tmp/postgres-data"
  persistentVolumeReclaimPolicy: Retain
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: team-c
spec:
  volumeName: postgres-data-pv
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi

# -----------------------------
# team-c: StatefulSet (PostgreSQL) + DaemonSet (monitoring-agent)
# -----------------------------
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-headless
  namespace: team-c
  labels: { app: postgres }
spec:
  clusterIP: None
  selector: { app: postgres }
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: team-c
  labels: { app: postgres }
spec:
  serviceName: "postgres-headless"
  replicas: 2
  selector: { matchLabels: { app: postgres } }
  template:
    metadata: { labels: { app: postgres } }
    spec:
      containers:
        - name: postgres
          image: postgres:15
          ports: [{ containerPort: 5432, name: postgres } ]
          env:
            - name: POSTGRES_PASSWORD
              value: "postgres123"
            - name: POSTGRES_DB
              value: "appdb"
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            tcpSocket: { port: 5432 }
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgres-data
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: monitoring-agent
  namespace: team-c
  labels: { app: monitoring-agent }
spec:
  selector: { matchLabels: { app: monitoring-agent } }
  template:
    metadata: { labels: { app: monitoring-agent } }
    spec:
      tolerations:
        - operator: "Exists"
      containers:
        - name: agent
          image: prom/node-exporter:v1.6.1
          ports: [{ containerPort: 9100, name: metrics } ]
          args: ["--path.procfs=/host/proc", "--path.sysfs=/host/sys", "--path.rootfs=/host"]
          volumeMounts:
            - name: proc
              mountPath: /host/proc
              readOnly: true
            - name: sys
              mountPath: /host/sys
              readOnly: true
            - name: root
              mountPath: /host
              readOnly: true
          resources:
            requests: { cpu: "50m", memory: "64Mi" }
            limits: { cpu: "200m", memory: "128Mi" }
      volumes:
        - name: proc
          hostPath: { path: /proc }
        - name: sys
          hostPath: { path: /sys }
        - name: root
          hostPath: { path: / }
---
apiVersion: v1
kind: Service
metadata:
  name: monitoring-metrics
  namespace: team-c
spec:
  type: ClusterIP
  selector: { app: monitoring-agent }
  ports:
    - name: metrics
      port: 9100
      targetPort: 9100
